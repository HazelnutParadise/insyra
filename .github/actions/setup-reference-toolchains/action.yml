# The one place the cross-language workflows get Python, R and the packages
# their gates import. Every package list used to be repeated in three
# workflows, and a missing one makes a gate skip rather than fail, so one copy
# is the safe number.
name: Set up the reference toolchains
description: Python 3.12 and R release with the packages the cross-language gates import.
inputs:
  python-packages:
    description: Python packages beyond the shared set, space-separated.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: "release"
    # scikit-learn is here because requireCrossLangTools imports it. It was
    # missing from one workflow until 2026-08-01, so that workflow's gate
    # skipped and it reported green by running nothing.
    - name: Install Python reference implementations
      shell: bash
      run: python -m pip install --upgrade pip numpy scipy statsmodels scikit-learn ${{ inputs.python-packages }}
    - name: Install R reference implementations
      shell: bash
      run: Rscript -e "install.packages(c('jsonlite','cluster','dbscan'), repos='https://cloud.r-project.org')"
