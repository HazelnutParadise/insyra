name: Clustering Parity

on:
  push:
    branches: ["main", "dev", "0.4"]
  pull_request:
    branches: ["main", "dev", "0.4"]

permissions:
  contents: read

jobs:
  clustering-parity:
    name: Slow clustering parity gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INSYRA_RUN_SLOW_PARITY: "1"
    steps:
    - uses: actions/checkout@v5
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Install Go dependencies
      run: go mod download
    - name: Set up the reference toolchains
      uses: ./.github/actions/setup-reference-toolchains
    - name: Run clustering parity suite
      run: go test -count=1 -timeout 25m ./stats -run "TestCrossLangClustering(Methods|GeneratedCorpus)"
