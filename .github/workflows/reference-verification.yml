# Runs every check that compares Insyra against an independent implementation,
# on a machine that actually has those implementations, with
# INSYRA_REQUIRE_REFERENCE_TOOLCHAINS=1 so a check that cannot run fails the job
# rather than skipping.
#
# The ordinary Test workflow installs none of this on purpose: `go test ./...`
# has to keep passing on a machine with no R and no Python. That is exactly why
# this job exists — without it, a skip and a pass are the same output, and this
# project has twice believed a verification that had never executed.

name: Reference Verification

on:
  push:
    branches: ["main", "dev", "0.4"]
  pull_request:
    branches: ["main", "dev", "0.4"]

permissions:
  contents: read

jobs:
  reference-verification:
    name: Cross-language and round-trip verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INSYRA_REQUIRE_REFERENCE_TOOLCHAINS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Go dependencies
        run: go mod download

      # Each package here is what a gate in the test suite imports. Adding a
      # gate without adding its dependency makes this job fail rather than
      # skip, which is the point. The shared set lives in the action; this job
      # adds what only it needs.
      - name: Set up the reference toolchains
        uses: ./.github/actions/setup-reference-toolchains
        with:
          python-packages: onnx onnxruntime safetensors cvxpy
      # torch is the gradient reference for the nn training suite. The CPU
      # wheel index keeps the download at ~200MB instead of the CUDA ~2GB.
      - name: Install PyTorch (CPU)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      # requireCrossLangTools looks for `python`; setup-python provides `python3`
      # and `python` on ubuntu-latest, but the ONNX gate asks for `python3`
      # specifically, so both names must resolve to the interpreter that has the
      # packages.
      - name: Confirm both interpreter names resolve
        run: |
          python -c "import numpy, scipy, statsmodels, sklearn"
          python3 -c "import onnx, onnxruntime, numpy, cvxpy"

      # Three groups are excluded rather than left to skip silently, which is
      # the failure mode this whole job exists to remove:
      #   ClusteringGeneratedCorpus, KNNGeneratedCorpus — 25-minute corpora,
      #     already run by the Clustering Parity and KNN Parity workflows.
      #   FactorAnalysis — guarded by INSYRA_STRICT_FACTOR_R_PARITY because the
      #     comparison is known not to pass: 512 of 52,176 leaves differ, on
      #     extraction drift on adversarial data, anderson-rubin scoring, and
      #     scores amplified through R's inverse correlation matrix, and
      #     documented at factorParityTol as mathematically equivalent
      #     solutions.
      - name: Cross-language verification against R and Python
        run: >
          go test -count=1 -timeout 30m ./stats/
          -run "TestCrossLang"
          -skip "TestCrossLang(ClusteringGeneratedCorpus|KNNGeneratedCorpus|FactorAnalysis)"
      - name: ONNX round trip against an independent runtime
        run: go test -count=1 -timeout 10m ./ml/ -run "TestONNX"
      - name: nn ONNX operator and model parity
        run: go test -count=1 -timeout 10m ./nn/...
      - name: Comparisons against scikit-learn
        run: go test -count=1 -timeout 10m ./ml/ -run "ScikitLearn"
      # Opt-in on a developer machine because cvxpy is usually absent; strict
      # mode above turns it on here.
      - name: Portfolio optimisation against cvxpy
        run: go test -count=1 -timeout 10m ./quant/ -run "TestPortfolioAgreesWithCVXPY"
