# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Test

on:
  push:
    branches: [ "main", "dev", "0.4" ]
  pull_request:
    branches: [ "main", "dev", "0.4" ]

permissions:
  contents: read

jobs:
  golangci:
    strategy:
      # One leg failing must not cancel the others: on 2026-09-11 a transient
      # module-proxy error on windows cancelled the ubuntu leg, the only one
      # that runs the race detector, so nobody learned whether it passed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        include:
          # The race detector needs cgo and slows the run, and a race does
          # not depend on the OS, so one leg carries it.
          - os: ubuntu-latest
            testflags: -race
          # Coverage runs on a leg without the race detector. Together, the
          # atomic coverage counters and the race detector slowed the
          # clustering tests past the 10-minute timeout; either one alone
          # finishes in under 30 seconds on a Mac.
          - os: macOS-latest
            testflags: -coverprofile=coverage.out
    name: Tests
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Install dependencies
      run: go mod download
    - name: Vet
      run: go vet ./...
    - name: Unit Test
      run: go test -v ${{ matrix.testflags }} ./...
    - name: Coverage summary
      if: matrix.os == 'macOS-latest'
      run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
