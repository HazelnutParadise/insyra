version: "2"

linters:
  # Beyond the default set: the five that watch for a resource left open and
  # an error lost or hidden. gosec, unparam and noctx were measured and left
  # off — gosec's 450 findings were mostly what a data library does on purpose.
  enable:
    - bodyclose
    - errorlint
    - nilerr
    - rowserrcheck
    - sqlclosecheck
  settings:
    errcheck:
      # fmt.Fprint* writes to display/terminal writers (Show, Summary, …)
      # where the error is not actionable. golangci-lint v1 excluded these
      # by default; v2 dropped that default, which turned the workflow red.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

# gofmt runs as part of `golangci-lint run`, so the lint job fails on any
# file gofmt would change.
formatters:
  enable:
    - gofmt
